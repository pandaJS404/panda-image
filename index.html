<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1116" />
    <meta name="color-scheme" content="dark" />
    <script>
      ;(() => {
        const storageKey = 'PANDA_UI_THEME'
        const darkThemeColor = '#0e1116'
        const lightThemeColor = '#f4f7fb'
        const root = document.documentElement
        let theme = 'dark'

        try {
          const storedTheme = window.localStorage.getItem(storageKey)
          if (storedTheme === 'light' || storedTheme === 'dark') {
            theme = storedTheme
          }
        } catch (error) {
          // Ignore storage failures and keep the default theme.
        }

        root.dataset.uiTheme = theme
        root.style.colorScheme = theme
        window.__PANDA_UI_THEME__ = theme

        const themeColorMeta = document.querySelector('meta[name="theme-color"]')
        if (themeColorMeta) {
          themeColorMeta.setAttribute(
            'content',
            theme === 'light' ? lightThemeColor : darkThemeColor,
          )
        }

        const colorSchemeMeta = document.querySelector('meta[name="color-scheme"]')
        if (colorSchemeMeta) {
          colorSchemeMeta.setAttribute('content', theme)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
